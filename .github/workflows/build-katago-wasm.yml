name: Build and Validate Zen Weiqi KataGo WASM

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-browser-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 libeigen3-dev

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          source "$HOME/emsdk/emsdk_env.sh"
          emcc --version

      - name: Build threaded KataGo and copy browser assets
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash build-katago.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check threaded build exports and files
        run: |
          test -s site/katago/kataeval-mt.js
          test -s site/katago/kataeval-mt.wasm
          test -s site/katago/model-b10c128.bin.gz
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const js=readFileSync('site/katago/kataeval-mt.js','utf8'); for (const s of ['mainScriptUrlOrBlob','PThread','pthread']) if (!js.includes(s)) throw new Error('threaded JS missing '+s); const w=readFileSync('site/katago/kataeval-mt.wasm'); if (w[0]!==0||w[1]!==97||w[2]!==115||w[3]!==109) throw new Error('invalid WASM magic'); console.log('PASS threaded JS markers and WASM magic');"
          node engine-src/web/test-search-mt.mjs

      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test model, eval, search, cancel, and game move in Chromium
        run: node engine-src/web/test-browser-mt.mjs

      - name: Upload tested Netlify publish folder
        uses: actions/upload-artifact@v4
        with:
          name: zen-weiqi-netlify-site-tested
          path: site/
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-weiqi-katago-validation-report
          path: .validation/kata-mt-browser.json
          if-no-files-found: ignore
          retention-days: 14
