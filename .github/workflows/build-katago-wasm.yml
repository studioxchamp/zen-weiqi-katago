name: Build Zen Weiqi KataGo WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-browser-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Eigen3 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev zip

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build threaded KataGo and copy browser assets
        run: |
          chmod +x build-katago.sh engine-src/scripts/build-eval.sh
          bash build-katago.sh

      - name: Upload Netlify publish folder
        uses: actions/upload-artifact@v4
        with:
          name: netlify-site-ready
          path: site/